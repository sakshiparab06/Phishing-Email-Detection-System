<!DOCTYPE html>
<html>

<head>
    <title>Phishing Email Detection</title>

    <style>

        body{
            font-family:Arial;
            max-width:700px;
            margin:auto;
            padding:40px;
        }

        textarea{
            width:100%;
            height:200px;
            padding:10px;
        }

        button{
            margin-top:15px;
            padding:10px 20px;
        }

        h1{
            color:#333;
        }

        .result{
            margin-top:20px;
            font-size:22px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<h1>📧 Phishing Email Detection</h1>

<form method="POST">

<textarea
name="email"
placeholder="Paste Email Content Here">
</textarea>

<br>

<button type="submit">
Detect
</button>

</form>

<div class="result">
{{ result }}
</div>

</body>
</html>
